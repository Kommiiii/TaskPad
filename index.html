<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
    <title>TaskPad</title>
    <link rel="icon" type="image/png" href="img/favicon.png">
    <script src="https://kit.fontawesome.com/ba45e0cefc.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="notepad">

        <div class="toolbar">
            <span class="toolbar-label">TaskPadder</span>
            <button id="theme-toggle" aria-label="Toggle theme">
                <i class="fa-solid fa-sun btn-icon" aria-hidden="true"></i>
            </button>
        </div>

        <div class="red-line"></div>

        <div class="content">
            <h1>YOUR TASKS</h1>

            <div class="input-area">
                <input type="text" id="task-input" placeholder="Type a task and press Enter…" maxlength="40"
                    autocomplete="off">
                <button id="add-btn">ADD</button>
            </div>

            <div class="status-row">
                <span id="status-bar">Ready.</span>
                <span id="page-indicator" class="page-indicator" aria-live="polite"></span>
            </div>

            <ol id="todo-list"></ol>

            <div id="pagination-controls" class="pagination-controls" hidden>
                <button id="prev-btn" class="page-btn" aria-label="Previous page" disabled>
                    <i class="fa-solid fa-chevron-left btn-icon" aria-hidden="true"></i>
                    PREV
                </button>
                <button id="next-btn" class="page-btn" aria-label="Next page">
                    NEXT
                    <i class="fa-solid fa-chevron-right btn-icon" aria-hidden="true"></i>
                </button>
            </div>

            <div class="divider"></div>
            <h3 class="section-title">FINISHED TASKS</h3>

            <ul id="completed-list"></ul>

            <button id="clear-btn" class="secondary-btn">CLEAR FINISHED</button>
        </div>

    </div>
    <div class="footer">
        &copy; 2026 Kyle Dungo - All rights reserved.
    </div>

    <script src="script.js"></script>
</body>

</html>
